<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>NEXORA</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet"/></head>
<body><canvas id="c"></canvas><div id="vig"></div>
<div id="title"><h1>NEXORA</h1><p id="tag"></p></div><div id="caps"></div><div id="flash"></div>
<div id="hint">PRESS ↓ OR SCROLL TO PROCEED <i>↓</i></div><div id="dots"></div>
<section id="auth"><div class="col">
<h2 id="h">Welcome Back</h2><p id="sub">Log in to your NEXORA account</p>
<form id="f" novalidate>
<label class="fld"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg><input id="em" type="email" placeholder="Email" autocomplete="email"/></label>
<label class="fld"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="pw" type="password" placeholder="Password" autocomplete="current-password"/><button type="button" id="eye" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></label>
<a id="fp">Forgot Password?</a>
<button class="go" id="go" type="submit"><span id="gl">Log In</span> &nbsp;→</button><p id="msg" role="alert"></p></form>
<p class="sw"><span id="swp">Don’t have an account?</span><a id="sw">Sign Up</a></p></div>
</section><small id="credit">Made by Pratham Modi</small>
<script type="module" src="/src/main.ts"></script></body></html>
